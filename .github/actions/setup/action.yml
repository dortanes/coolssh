name: Set up the toolchain
description: Go from go.mod, and Node.js with pnpm from frontend/package.json.

inputs:
  cache:
    description: Whether to cache Go modules and the pnpm store; release builds turn it off.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache }}
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: frontend/package.json
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: frontend/pnpm-lock.yaml
        package-manager-cache: false
