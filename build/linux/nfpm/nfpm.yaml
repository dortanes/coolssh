# The deb, rpm and Arch packages: https://nfpm.goreleaser.com
name: "coolssh"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0" # x-release-please-version
section: "default"
priority: "extra"
maintainer: "dortanes"
description: "SSH client for macOS, Windows and Linux"
vendor: "dortanes"
homepage: "https://github.com/dortanes/coolssh"
license: "MIT"
release: "1"

contents:
  - src: "./bin/coolssh"
    dst: "/usr/local/bin/coolssh"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/coolssh.png"
  - src: "./build/linux/coolssh.desktop"
    dst: "/usr/share/applications/coolssh.desktop"

# The GTK 4 and WebKitGTK 6.0 stack Wails v3 builds against.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
